<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | TRONCO E AREPA</title>

    <link
        rel="stylesheet"
        href="css/cliente.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="login-logo">
                🍔
            </div>

            <h1>
                TRONCO E AREPA
            </h1>

            <p>
                Inicia sesión para realizar tu pedido
            </p>


            <form id="loginForm">


                <label>
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="correo@gmail.com"
                    required>


                <button
                    type="submit">

                    INGRESAR

                </button>


            </form>


            <div id="mensaje-login"></div>


            <p class="registro">

                ¿No tienes cuenta?

                <a href="registro.html">
                    Regístrate
                </a>

            </p>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
